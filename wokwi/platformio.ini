[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

; Set USE_BACKEND_API to 1 for backend-connected simulation; configure the URL in src/main.cpp.
; Use host.wokwi.internal only with the Wokwi Private IoT Gateway enabled.
build_flags =
  -D USE_BACKEND_API=0
